name: Apply 0.9.6 UX patch

on:
  push:
    branches: [agent/import-ux-0.9.6]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-ux-0.9.6
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_0_9_6.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 0.9.6: simplify privacy copy and fix request import"
          git push origin HEAD:agent/import-ux-0.9.6
