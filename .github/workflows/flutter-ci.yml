name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete generated Flutter platform files
        run: flutter create --platforms=android --org com.supervisionpocket --project-name supervision_pocket .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore dedicated review signing key
        uses: actions/download-artifact@v4
        with:
          name: supervision-pocket-review-signing-key-seed
          path: android/app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: valera2872/supervision-pocket
          run-id: 30635720524

      - name: Verify review signing key
        run: |
          test -f android/app/review.keystore
          keytool -list \
            -keystore android/app/review.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Format sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: supervision-pocket-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
